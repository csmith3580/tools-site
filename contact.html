<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

     crossorigin="anonymous"></script><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Ignitool</title>
<meta name="description" content="Contact Ignitool — get in touch with questions, feedback, or advertising inquiries.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0f0f0f;--ink2:#444;--muted:#888;--border:#e4e4e4;--bg:#fafaf8;--surface:#fff;--accent:#2563eb;--green:#16a34a;--radius:10px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
  nav{position:sticky;top:0;background:rgba(250,250,248,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center}
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--ink);text-decoration:none;letter-spacing:-.5px}
  .logo span{color:var(--accent)}
  .page{max-width:600px;margin:0 auto;padding:56px 24px 80px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;margin-bottom:10px;letter-spacing:-.02em}
  p{color:var(--ink2);margin-bottom:28px}
  .form-group{margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin-bottom:6px}
  input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{height:130px;resize:vertical}
  button{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .15s}
  button:hover{opacity:.9}
  .success{display:none;background:#f0fdf4;border:1px solid #86efac;border-radius:var(--radius);padding:16px 20px;font-size:14px;color:#16a34a;margin-top:16px}
  footer{border-top:1px solid var(--border);padding:28px 24px;text-align:center}
  footer p{font-size:13px;color:var(--muted)}
  .footer-links{display:flex;justify-content:center;gap:20px;margin-bottom:10px;flex-wrap:wrap}
  .footer-links a{font-size:13px;color:var(--muted);text-decoration:none}
</style>
<link rel="canonical" href="https://ignitool.com/contact">
</head>
<body>
<nav><a class="logo" href="/">Igni<span>tool</span></a></nav>
<div class="page">
  <h1>Contact us</h1>
  <p>Questions, feedback, bug reports, or advertising inquiries — we read every message.</p>
  <div class="form-group"><label>Your name</label><input type="text" id="name" placeholder="Your name"></div>
  <div class="form-group"><label>Email address</label><input type="email" id="email" placeholder="you@example.com"></div>
  <div class="form-group">
    <label>Subject</label>
    <select id="subject">
      <option>General question</option>
      <option>Bug report</option>
      <option>Tool request</option>
      <option>Advertising / sponsorship</option>
      <option>Other</option>
    </select>
  </div>
  <div class="form-group"><label>Message</label><textarea id="message" placeholder="Tell us what's on your mind…"></textarea></div>
  <button onclick="submitForm()">Send message</button>
  <div class="success" id="success">✓ Message received — we'll get back to you within 2 business days.</div>
</div>
<footer>
  <div class="footer-links">
    <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy policy</a><a href="/terms.html">Terms of use</a>
  </div>
  <p>© 2026 Ignitool — Free tools, no sign-up required.</p>
</footer>
<script>
function submitForm(){
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const msg=document.getElementById('message').value.trim();
  if(!name||!email||!msg){alert('Please fill in all fields.');return;}
  document.getElementById('success').style.display='block';
}
</script>
</body>
</html>
